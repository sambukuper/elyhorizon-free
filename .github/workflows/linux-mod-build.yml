name: linux mod build
# Builds the game the way install.sh does on a player's Linux machine
# (cargo build --release -p horizon-client --features mods, no Steam), runs
# the e4mc crate's own tests and keeps the binary as an artifact. Dispatch
# by hand: it is the fork's check that the modded Linux build works, not a
# release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: The e4mc crate's tests
        run: cargo test -p horizon-e4mc
      - name: Build the modded game
        run: cargo build --release -p horizon-client --features mods
      - name: It starts and carries the mods feature
        run: |
          target/release/horizon-client --help | head -5
          target/release/horizon-client --help | grep -q -- '--resources'
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-client-linux-x86_64
          path: target/release/horizon-client
          retention-days: 14
